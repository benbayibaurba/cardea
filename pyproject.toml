[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardea"
version = "0.1.0"
description = "Inference client for CARDEA, an auditable end-to-end VLM for coronary angiography"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "openai>=1.40",
    "pydantic>=2.5",
    "pillow>=10.0",
    "numpy>=1.24",
    "pydicom>=2.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
app = ["gradio>=4.44,<6"]

[project.urls]
Model = "https://huggingface.co/benbayibaurba/cardea-v0"

[tool.setuptools.packages.find]
where = ["src"]
